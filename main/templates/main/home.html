<!DOCTYPE html>
<html>
<head>
    <title>Student Records</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 50px 20px;
            min-height: 100vh;
            background-color: #0f172a;
            background-image:
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px 40px;
            border-radius: 16px;
        }
        h1 {
            text-align: center;
            color: #134e4a;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #0d9488;
            color: white;
            text-align: left;
            padding: 16px;
        }
        td {
            padding: 16px;
            border-bottom: 1px solid #e5e7eb;
            color: #374151;
        }
        tr:hover td {
            background: #f0fdfa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Records</h1>

        <table>
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Course</th>
                <th>Age</th>
            </tr>
            {% for student in students %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>{{ student.name }}</td>
                <td>{{ student.course }}</td>
                <td>{{ student.age }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
